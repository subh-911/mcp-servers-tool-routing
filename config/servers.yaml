# MCP Server Configurations
# This file defines the MCP servers to connect to on startup

servers:
  # Database MCP Server
  - name: "database"
    description: "Database operations server"
    enabled: true
    connection:
      type: "stdio"  # stdio, sse, or websocket
      command: "python"
      args:
        - "src/examples/mock_servers/database_server.py"
      env: {}
    options:
      auto_reconnect: true
      max_reconnect_attempts: 3
      reconnect_delay: 5
      health_check_interval: 30

  # Filesystem MCP Server
  - name: "filesystem"
    description: "File system operations server"
    enabled: true
    connection:
      type: "stdio"
      command: "python"
      args:
        - "src/examples/mock_servers/filesystem_server.py"
      env: {}
    options:
      auto_reconnect: true
      max_reconnect_attempts: 3
      reconnect_delay: 5
      health_check_interval: 30

  # API MCP Server
  - name: "api"
    description: "External API operations server"
    enabled: true
    connection:
      type: "stdio"
      command: "python"
      args:
        - "src/examples/mock_servers/api_server.py"
      env: {}
    options:
      auto_reconnect: true
      max_reconnect_attempts: 3
      reconnect_delay: 5
      health_check_interval: 30

