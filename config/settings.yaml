# Application Settings
app:
  name: "MCP Tool Router"
  version: "1.0.0"
  description: "Production-quality MCP Tool Router with FastAPI"
  environment: "development"
  debug: true

# Server Settings
server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  reload: true

# Logging
logging:
  level: "INFO"
  format: "json"  # json or text
  output: "stdout"  # stdout or file
  file_path: "logs/app.log"

# CORS Configuration
cors:
  enabled: true
  origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
  allow_credentials: true
  allow_methods:
    - "*"
  allow_headers:
    - "*"

# Router Configuration
router:
  max_retries: 3
  retry_backoff_base: 2
  connection_timeout: 30
  request_timeout: 60
  max_connections_per_server: 10
  enable_tool_namespacing: true
  namespace_separator: ":"

# Circuit Breaker Configuration
circuit_breaker:
  enabled: true
  failure_threshold: 5
  timeout_seconds: 60
  half_open_max_calls: 3
  monitoring_window: 300

# Tool Schema Cache
cache:
  enabled: true
  ttl_seconds: 3600
  max_size: 1000

# Rate Limiting
rate_limiting:
  enabled: true
  requests_per_server: 100
  window_seconds: 60

# Health Check
health_check:
  enabled: true
  interval_seconds: 30
  timeout_seconds: 10

# Metrics
metrics:
  enabled: true
  prometheus_enabled: true
  export_port: 9090
